qa:
  canonical_records_covered: 29
  rules:
    - Thulo Sailung is shared with Dolakha and must not be duplicated as two unrelated attractions.
    - Ramechhap Airport is transport infrastructure, not the coordinate for Manthali town.
    - Jata Pokhari and Panch Pokhari remain separate lake destinations.
    - Numbur Himal and Numbur Cheese Circuit are a mountain region and a trekking route respectively.
    - Weak local sites remain HOLD rather than receiving guessed coordinates.
    - River records use corridors and verified access nodes, never midstream pins.

