district: Ramechhap
province: Bagmati
version: visitor-ready-v2
canonical_record_count: 29

introduction:
  short: >
    Ramechhap stretches from the warm Tamakoshi valley around Manthali to remote alpine country beneath Numbur Himal. It is both an important road-air gateway toward the Everest region and a destination for cultural hill travel, sacred lakes, highland trekking and rural landscapes.
history:
  short: >
    Historic Ramechhap developed around hill bazaars, trade routes and culturally diverse settlements. Older approaches toward the Everest region crossed communities such as Bamti Bhandar, while Doramba, Sailung and the district's temples preserve important Tamang, Buddhist and Hindu cultural landscapes.

main_hubs:
  - Kathmandu
  - Manthali
  - Ramechhap Bazaar
  - Doramba
  - Bamti Bhandar

map_rules:
  large_settlements: area_center_and_radius
  mountain_regions: polygon_or_area
  trekking_routes: route_or_corridor
  rivers: corridor
  exact_buildings_and_transport: point_when_verified
  uncertain_local_sites: routing_hold

permit_policy:
  restricted_area: >
    Ramechhap is not listed in Nepal Immigration's current restricted-area trekking table. Do not invent a district restricted-area permit.
  trekking: >
    Check current TIMS/guide rules for the specific published trekking itinerary before travel; requirements can change and cross-district routes may inherit rules from adjoining areas.
  climbing: >
    Any mountaineering objective requiring climbing authorization must use current Government of Nepal rules; trekking access does not imply climbing permission.
  fees: dynamic

visitor_systems:
  - name: Manthali gateway
    geometry: area
    introduction: District headquarters and the principal road-air gateway for many visitors moving toward the Everest region.
    how_to_visit:
      from: Kathmandu
      mode: road
      notes: Use current highway conditions and seasonal traffic information; travel times are dynamic.
  - name: Numbur highlands
    geometry: mountain_area_and_route_network
    introduction: Remote northern trekking country linking Sherpa settlements, alpine pastures, sacred lakes and the Numbur Himal landscape.
    how_to_visit:
      from: Manthali
      via: northern Ramechhap / Umakunda access roads and trailheads
      notes: Final approaches are remote and can involve rough roads followed by multi-day trekking.
  - name: Sailung-Doramba cultural highlands
    geometry: area_and_route_network
    introduction: Hill country shared with the wider Sailung landscape, combining panoramic ridges, Tamang settlements, monasteries and cultural trekking.
    how_to_visit:
      from: Kathmandu or Manthali
      via: Doramba/Sailung road approaches
      notes: Confirm road condition in monsoon and winter.

