introduction:
  short: >
    Kavrepalanchok is one of the easiest mountain-and-heritage districts to explore from Kathmandu, combining Buddhist pilgrimage at Namo Buddha, medieval Newar towns such as Panauti, Himalayan viewpoints around Dhulikhel and Bethanchok, village hikes, temples, valleys, waterfalls and agricultural landscapes.

history:
  short: >
    Kavrepalanchok has long linked Kathmandu with eastern Nepal through trade roads, Newar market towns and hill settlements. Panauti, Banepa and Dhulikhel preserve major urban and religious heritage, while Namo Buddha is one of Nepal's important Buddhist pilgrimage landscapes and Palanchok Bhagwati remains a major Hindu pilgrimage centre.

