district: Nuwakot
province: Bagmati
status: visitor_ready_enrichment_v2
last_verified: 2026-08-12

introduction:
  short: >
    Nuwakot is a historic hill district northwest of Kathmandu where palace-town heritage, sacred river confluences, Himalayan viewpoints, rural valleys and northern pilgrimage routes meet. Its strongest visitor anchors are the old Nuwakot palace town, Devighat, Kakani, Dupcheshwar and the Trishuli river corridor.
  why_visit:
    - unification-era palace and fort heritage
    - Newar old-town streets and temples
    - pilgrimage at Devighat and Dupcheshwar
    - Himalayan viewpoints around Kakani and Suryachaur
    - rafting and river landscapes
    - village and rural-road exploration

history:
  short: >
    Nuwakot became strategically important during the expansion of the Gorkha kingdom and the political unification of Nepal. The hilltop palace complex at Nuwakot is closely associated with Prithvi Narayan Shah and the consolidation of trade and military routes between Kathmandu, Tibet-facing valleys and the Trishuli corridor. Devighat later became an important memorial and pilgrimage landscape linked to the king's final days.

main_hubs:
  - name: Kathmandu
    role: national_gateway
    note: "Best starting hub for Kakani, Nuwakot old town, Bidur/Trishuli and onward travel north."
  - name: Bidur / Trishuli
    role: district_gateway
    note: "Practical district hub for Nuwakot old town, Devighat, Betrawati and routes toward Kispang and Dupcheshwar."

permit_policy:
  restricted_area_permit:
    required_for_nuwakot: false
    note: "Nuwakot does not appear in the Department of Immigration restricted-area trekking table as of 2026-08-12."
  national_park_entry:
    rule: conditional
    note: "Only applies when a route actually enters Shivapuri-Nagarjun or Langtang National Park; fees/rules are dynamic and should be checked with DNPWC/park offices."
  rafting:
    rule: operator_dependent
    note: "Use a current licensed operator and current river-safety conditions rather than a permanent launch promise."

visitor_areas:
  - id: nuwakot-durbar-complex
    name: Nuwakot Durbar Complex
    type: heritage_cluster
    intro: >
      Hilltop palace-fort and temple complex associated with Nepal's unification period. The cluster includes the main palace, Bhairabi and Taleju shrines and the surrounding old town.
    geometry:
      type: area_with_child_pins
      center: {lat: 27.9207, lng: 85.1635}
      radius_m: 900
      coordinate_quality: approximate_heritage_cluster_center
    things_to_do: [palace-area walk, heritage photography, temple visits, old-town exploration, viewpoint stops]
    permits_and_entry:
      special_permit: false
      admission_or_access: dynamic
      note: "Restoration/public-access status of individual palace structures must be checked before routing inside buildings."
    how_to_visit:
      from_kathmandu: "Drive via Kakani/Osho Tapoban side or the main Trishuli road toward Bidur, then climb to the old Nuwakot heritage town."
      from_bidur: "Short uphill road journey to the palace-town ridge; final heritage area is best explored on foot."
    child_pois:
      - name: Saat Tale Durbar
        type: palace
        intro: "Seven-storey Newari palace traditionally associated with Prithvi Narayan Shah and the Nuwakot court."
        coordinate_status: pending_structure_level_pin
        access_status: restoration_dynamic
      - name: Bhairabi Temple, Nuwakot
        type: temple
        intro: "Principal shrine of the old palace town and a key centre of the Sindure Jatra tradition."
        coordinate_status: pending_exact_pin
      - name: Taleju Temple, Nuwakot
        type: temple
        intro: "Historic royal temple within the palace-town religious landscape."
        coordinate_status: pending_exact_pin
      - name: Nuwakot old town
        type: historic_settlement
        intro: "Traditional settlement lanes and houses surrounding the palace and temple cluster."
        geometry: area

  - id: devighat
    name: Devighat
    type: pilgrimage_and_memorial_area
    intro: >
      Sacred confluence area near the Trishuli-Tadi river system, known for pilgrimage, cremation traditions and memorial associations with Prithvi Narayan Shah.
    geometry:
      type: area
      center: {lat: 27.9018, lng: 85.1260}
      radius_m: 1200
      coordinate_quality: approximate_confluence_area
    things_to_do: [pilgrimage, river-confluence viewing, memorial visit, photography]
    permits_and_entry: {special_permit: false, ticket: generally_no_special_tourism_permit, festival_access: dynamic}
    how_to_visit:
      from_bidur: "Drive south toward the Devighat confluence area; use the named temple/memorial access road rather than routing to the middle of the river."
      from_kathmandu: "Travel toward Bidur/Trishuli and branch to Devighat before or after the district hub."
    child_pois:
      - name: Prithvi Narayan Shah memorial area
        type: memorial_landscape
        intro: "Memorial and cremation-associated heritage area linked to the final chapter of Prithvi Narayan Shah's life."
        coordinate_status: pending_exact_pin

  - id: dupcheshwar-mahadev
    name: Dupcheshwar Mahadev Temple
    type: cave_temple_and_pilgrimage_site
    municipality: Dupcheshwar Rural Municipality
    intro: >
      Major Shiva pilgrimage destination set in a steep river-gorge and forest landscape in northern Nuwakot.
    geometry:
      type: point_and_small_area
      coordinate_status: pending_authoritative_temple_pin
    things_to_do: [temple visit, pilgrimage, gorge scenery, short walking]
    permits_and_entry: {special_permit: false, temple_entry: usually_open_pilgrimage_site, festival_conditions: dynamic}
    how_to_visit:
      from_bidur: "Travel north/east through the Dupcheshwar rural road network; the final approach may include steep local road and walking sections depending on season."
      from_kathmandu: "Reach Bidur/Trishuli first for the simplest district orientation, then continue toward Dupcheshwar."
    safety_note: "Monsoon road conditions, landslides and river-gorge paths must be checked locally."

  - id: betrawati
    name: Betrawati
    type: historic_river_settlement
    intro: >
      Historic settlement on the Nuwakot-Rasuwa corridor associated with the 1792 Nepal-Tibet settlement and the Trishuli river route.
    geometry:
      type: settlement_area
      center: {lat: 27.9677, lng: 85.1630}
      radius_m: 900
      coordinate_quality: approximate_settlement_center
    things_to_do: [historic-stop visit, river views, route break toward Rasuwa]
    permits_and_entry: {special_permit: false}
    how_to_visit:
      from_bidur: "Drive north on the Trishuli-Rasuwa corridor."
      from_kathmandu: "Follow the Trishuli/Rasuwa road via Bidur."
    child_areas:
      - name: Betrawati treaty area
        type: heritage_landscape
        intro: "Historical landscape associated with Nepal-Tibet diplomacy; exact interpretation point remains to be verified."
        routing_status: hold_exact_pin

