publication_rules:
  - "Large towns, valleys, rivers and protected sectors use area/corridor geometry, never a fake attraction pin."
  - "Restoration/access status of palace structures must be checked before claiming indoor visitation."
  - "National-park fees and opening rules are dynamic."
  - "No Nuwakot-wide restricted-area permit should be invented; current DOI restricted-area rules do not list Nuwakot."
  - "Weak local records such as Chhahare waterfall, Samari Bhanjyang exact centre and northern-village clusters stay PARTIAL/HOLD until mapped."

