district: Makwanpur
province: Bagmati
status: visitor_ready_enrichment_v1
last_verified: 2026-08-12

introduction:
  short: >
    Makwanpur links the Kathmandu Valley with Nepal's central Terai and combines cool hill stations, old trade routes, forts, reservoir landscapes, pilgrimage sites, agro-tourism and forest corridors. The district's tourism is split between the Daman-Chitlang-Kulekhani highlands in the north, Hetauda in the south-central valley, and protected/river landscapes toward Manahari and Parsa National Park.
  why_visit:
    - Himalayan panoramas from Daman and Sim Bhanjyang
    - Chitlang village, farms and old Kathmandu-Terai route heritage
    - Kulekhani/Indra Sarovar and Markhu lakeside scenery
    - forts and transport history at Makwanpurgadhi, Chisapani and Bhimphedi
    - Hetauda temples, memorials and city gateways
    - pilgrimage sites such as Risheshwar and Bajrabarahi
    - forest and wildlife-edge landscapes toward Parsa National Park

history:
  short: >
    Makwanpur was historically important because routes between the Kathmandu Valley and the southern plains passed through its hills. Makwanpurgadhi was associated with the Sen rulers and later Gorkhali state expansion, while Bhimphedi and Chisapani controlled old trade and transport approaches to Kathmandu. The Chitlang-Tistung corridor preserves traces of the pre-highway route into the Valley, and Hetauda later grew into a major highway and industrial gateway linking Kathmandu, Chitwan and the eastern Terai.

main_hubs:
  - Hetauda
  - Daman
  - Chitlang
  - Markhu/Kulekhani
  - Bhimphedi
  - Manahari

