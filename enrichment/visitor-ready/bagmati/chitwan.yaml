publication_rules:
  - "Never describe park fees, safari schedules, canoe departures, homestays or transport timetables as permanent facts."
  - "Do not create a fake center pin for Chitwan National Park, Beeshazar, Rapti, Narayani, Madi Valley or Chepang Hill Trail when routing users."
  - "Use exact pins for museums, gates, forts and conservation facilities only when location is independently mapped or first-party verified."
  - "For area circles in this file, radius is a visitor-orientation aid, not a legal/administrative boundary."
  - "Safety-sensitive activities require current local/operator verification."

