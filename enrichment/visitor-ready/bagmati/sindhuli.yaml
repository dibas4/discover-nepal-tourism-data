publication_rules:
  - "Do not publish Selfie Danda, Betini Tal or Bhadrakali hill as exact navigation pins until their standard locations are verified."
  - "Treat BP Highway, Sunkoshi, Kamala River, Chure forest and Mahabharat ridges as corridors/areas, not point attractions."
  - "Farm visits, rafting, local fees, festival access and road conditions are dynamic."
  - "Community tourism should point to a named participating village, homestay or local program, not an ethnic-community centroid."
  - "No Sindhuli-wide restricted-area trekking permit is required under the current Immigration restricted-area system."

