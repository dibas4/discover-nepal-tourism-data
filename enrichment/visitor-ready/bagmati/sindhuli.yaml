district: Sindhuli
province: Bagmati
status: visitor_ready_enrichment_v1
last_verified: 2026-08-12

introduction:
  short: >
    Sindhuli is a mid-hill district east of Kathmandu where military history, scenic highways, orchard country, river valleys, pilgrimage sites and rural landscapes meet. The district is best known for Sindhuligadhi, the BP Highway, junar orchards and the transition from Mahabharat ridges into the warmer Kamala and Marin valleys.
  why_visit:
    - historic forts and battle heritage
    - scenic BP Highway road trips
    - junar orchard and farm tourism
    - hill viewpoints and ridge walks
    - Hindu pilgrimage sites
    - Sunkoshi and Kamala river landscapes

history:
  short: >
    Sindhuli occupies an important place in Nepal's military and political history. Sindhuligadhi is associated with the 1767 battle in which Gorkhali forces resisted an East India Company expedition. The district also contains older fort and pilgrimage landscapes such as Hariharpurgadhi and Kusheshwar Mahadev, while Dumja is linked with the Koirala family and Nepal's modern democratic history.

main_hubs:
  - name: Sindhulimadhi / Kamalamai
    role: district_headquarters_and_primary_hub
    map_behavior: area
  - name: Khurkot
    role: northern_bp_highway_and_sunkoshi_gateway
    map_behavior: area
  - name: BP Highway corridor
    role: main_road_access_from_kathmandu_and_terai
    map_behavior: corridor

permit_overview:
  restricted_area_permit: false
  district_tourism_permit: false
  note: >
    Sindhuli is not listed as a restricted trekking district in the current Department of Immigration restricted-area permit system. Individual temples, memorials, private attractions, rafting services or local facilities may still charge current entry or activity fees.
  dynamic_fields:
    - local_entry_fees
    - rafting_operator_fees
    - event_or_festival_access
    - road_conditions

map_model_rules:
  large_area: use approximate center plus practical visitor radius or polygon
  point_poi: use precise pin only for verified forts, temples, memorials or facilities
  corridor: use line or polygon geometry for rivers, highways and long trails
  hold: do not route users directly to weakly verified local sites

visitor_areas:
