    name: Sindhuligadhi Fort and heritage landscape
    type: heritage_area
    municipality: Kamalamai Municipality
    intro: >
      Sindhuligadhi is Sindhuli's signature historic destination, combining fort remains, battle-history interpretation, memorial spaces and broad views over the BP Highway and surrounding hills.
    geometry:
      type: area_with_child_pois
      coordinate_status: use_verified_fort_or_memorial_pin_when_available
    things_to_do:
      - explore fort remains
      - learn about the 1767 battle
      - visit the war memorial
      - hill and highway viewpoints
      - short heritage walks
      - photography
    permits_and_entry:
      special_permit_required: false
      entry_fee_status: dynamic
    how_to_visit:
      from_main_hub: Sindhulimadhi / Kamalamai
      transport: [road_vehicle, local_taxi, private_vehicle]
      route_summary: >
        Travel from Sindhulimadhi toward the Sindhuligadhi section of the BP Highway, then use the signed/local access road to the heritage hill. Route users to a verified fort or memorial access point, not to a generic hill-center coordinate.
      final_access: short_walks_between_heritage_nodes
      road_condition: dynamic
    child_pois:
      - name: Sindhuligadhi Fort
        type: historic_fort
        intro: "Core defensive site associated with the 1767 Gorkhali victory over the East India Company expedition."
      - name: Sindhuligadhi viewpoint
        type: viewpoint_area
        intro: "Hilltop panorama over the highway, valleys and Mahabharat hills."
      - name: Sindhuligadhi War Memorial
        type: memorial
        intro: "Modern memorial landscape interpreting the battle and defensive history."

