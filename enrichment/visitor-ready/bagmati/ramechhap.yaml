publication_rules:
  - "Do not publish Ramechhap Airport flight schedules as static facts; CAAN/airline operations are seasonal and dynamic."
  - "Do not invent a restricted-area permit for Ramechhap; current Immigration restricted-area rules do not list the district."
  - "Technical climbing objectives require separate current climbing authorization and must not inherit from ordinary trekking records."
  - "Bethali, Bhaleshwor Mahadev, Umatirtha and unnamed Khimti waterfalls remain routing HOLD until exact access is verified."
  - "Sailung is a shared cross-district landscape with Dolakha; use one parent destination relationship."
  - "Area and route coordinates are orientation aids unless authoritative GIS is available."

