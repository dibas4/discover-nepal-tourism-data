map_model_rules:
  large_area: "Use approximate center plus radius/polygon; never route to a single fake center for mountain regions, valleys or shared ridges."
  point_poi: "Use exact pins only for verified temples, monasteries, memorials, airports or specific visitor facilities."
  route: "Use route/line geometry for trekking circuits, river corridors and multi-stage access."
  coordinate_quality:
    verified: "first-party or reliably mapped reference"
    approximate: "visitor-orientation center, not legal boundary"
    pending: "do not publish direct navigation until verified"

permit_framework:
