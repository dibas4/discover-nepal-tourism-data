    note: "Where a route is covered by current TIMS/guide rules, apply the current Nepal Tourism Board requirements at booking time rather than hard-coding permanent text."
  climbing:
    status: conditional
    note: "Technical peaks and mountaineering objectives require the current climbing authorization system; ordinary viewpoint hikes do not inherit climbing permits."

