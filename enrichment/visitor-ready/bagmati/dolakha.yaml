district: Dolakha
province: Bagmati
status: visitor_ready_enrichment_v1
last_verified: 2026-08-12

introduction:
  short: >
    Dolakha is a mountain district east of Kathmandu combining pilgrimage, Newar heritage, high Himalayan trekking, glacial lakes, Sherpa settlements, historic gateways and scenic hill towns. Its visitor geography ranges from accessible Charikot, Dolakha town and Jiri to the remote Rolwaling and Lapchi valleys inside the Gaurishankar Conservation Area.
  why_visit:
    - Kalinchowk pilgrimage and Himalayan views
    - historic Dolakha town and Bhimsen Temple
    - Rolwaling Valley and Tsho Rolpa trekking
    - Jiri hill-town heritage and hikes
    - sacred Lapchi Valley
    - highland viewpoints and village culture

history:
  short: >
    Dolakha developed around old trans-Himalayan trade corridors, Newar settlement, Hindu and Buddhist sacred sites and mountain routes linking central Nepal with northern valleys. Dolakha town retains important temple and settlement heritage, while Jiri became famous as a classic overland gateway for early Everest expeditions before Lukla flights became dominant.

main_hubs:
  - {name: Kathmandu, role: primary_external_gateway}
  - {name: Charikot, role: main_district_transport_and_service_hub, center: {lat: 27.6667, lng: 86.0333}}
  - {name: Dolakha town, role: heritage_hub}
  - {name: Jiri, role: eastern_hill_and_trekking_hub}
  - {name: Singati, role: northern_road_gateway}

permit_framework:
  gaurishankar_conservation_area:
    required_for_foreign_visitors: true
    applies_to: [Kalinchowk, Rolwaling, Tsho Rolpa, Gaurishankar routes, Lapchi-related GCA travel]
    fee_status: dynamic
    source: NTNC_GCAP_epermit
  restricted_area:
    required: conditional
    current_rule: "Dolakha restricted area applies to Gaurishankar Rural Municipality ward 9 and Bigu Rural Municipality ward 1."
    current_fee: "USD 20 per person per week"
    source: Department_of_Immigration
    note: "Do not apply this restricted-area permit to the whole district. Check the exact route and ward."
  climbing:
    required: conditional
    note: "Technical peaks use separate current mountaineering/peak authorization where applicable."

