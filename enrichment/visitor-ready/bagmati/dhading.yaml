map_model_rules:
  large_area: "Use approximate area center plus radius/polygon; never route users to one fake center pin."
  point_poi: "Use exact pin only for verified temples, forts, viewpoints, trailheads or facilities."
  corridor: "Use line/polygon geometry for rivers, valleys and trekking routes."
  pending: "If an exact visitor-access point is weak, keep coordinate_status pending and route only to the nearest verified hub."

permit_policy:
  general: >
    No Dhading-wide special tourism permit was identified. Ruby Valley and the Chitwan Chepang Hill Trail are not treated here as Nepal restricted-area permit zones. If an itinerary crosses into a national park, conservation area or another district with separate rules, use that area's current permit/entry requirements.
  rafting: "Visitors normally book through a licensed/current rafting operator; river activity fees and launch arrangements are dynamic operator data rather than a district permit."
  temples_and_local_sites: "Treat current donations, local tickets, festival access and parking fees as dynamic unless an official authority publishes a fixed requirement."
  trekking: "Guide, TIMS or agency requirements must be checked against current Nepal Tourism Board rules for the exact itinerary before publication; do not assume one rule covers every Ruby Valley variant."

