district: Dhading
province: Bagmati
status: visitor_ready_enrichment_v1
last_verified: 2026-08-12

introduction:
  short: >
    Dhading stretches from the Himalayan zone around Ganesh Himal in the north to lower Mahabharat hills and the Trishuli corridor in the south. It combines remote trekking, Tamang and Gurung villages, river adventure, pilgrimage sites, waterfalls, historic hill forts and practical highway gateways between Kathmandu, Pokhara and Chitwan.
  why_visit:
    - Ruby Valley and Ganesh Himal trekking
    - Tamang and Gurung village culture
    - Trishuli rafting and canyoning
    - Ganga Jamuna waterfall and pilgrimage
    - Salyantar plateau and Budhi Gandaki views
    - local temples, forts and ridge viewpoints

history:
  short: >
    Dhading's settlements developed along old hill routes connecting the Kathmandu Valley with Ganesh Himal, the Budhi Gandaki basin and western Nepal. Tamang, Gurung, Newar, Brahmin-Chhetri and other communities shaped the district's cultural geography. Today the district is both a major transport corridor and one of Nepal's quieter trekking regions, with historic kot and durbar landscapes surviving in the central hills.

