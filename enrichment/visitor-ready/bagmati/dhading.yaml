publication_rules:
  - "Do not publish a guessed exact pin for Dabjong Durbar, Maidi Kot or other weak heritage records."
  - "Do not route users to the middle of Ruby Valley, Ganesh Himal, Budhi Gandaki, Ankhu Khola or the Trishuli River."
  - "Road access to northern Dhading is seasonal and landslide-sensitive; route condition must remain dynamic."
  - "Homestays, lodges, rafting launch points, festival dates and local entry fees must be current-operation fields."
  - "For trekking itineraries crossing into Rasuwa, Langtang National Park or another regulated area, inherit that area's current permit/entry rules."

