name: Finalize compact canonical matching

on:
  push:
    branches:
      - integration/nepal-visitor-ready-complete
    paths:
      - ".github/workflows/finalize-compact-canonical-matching.yml"

permissions:
  contents: write

jobs:
  patch-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/nepal-visitor-ready-complete
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Add parenthetical and compact-list matching
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_nepal_visitor_ready_master.py")
          source = path.read_text(encoding="utf-8")
          original = source

          old = '''    raw_parts = [clean(name)] + [clean(part) for part in re.split(r"\\s*/\\s*|\\s*,\\s*|\\s*\\+\\s*|\\s+\\band\\b\\s+|\\s+\\bor\\b\\s+", clean(name), flags=re.I) if clean(part)]\n'''
          new = '''    clean_name = clean(name)\n    parenthetical_parts = [clean(part) for part in re.findall(r"\\(([^)]+)\\)", clean_name) if clean(part)]\n    without_parenthetical = clean(re.sub(r"\\s*\\([^)]*\\)\\s*", " ", clean_name))\n    raw_parts = [clean_name, without_parenthetical, *parenthetical_parts] + [clean(part) for part in re.split(r"\\s*/\\s*|\\s*,\\s*|\\s*\\+\\s*|\\s+\\band\\b\\s+|\\s+\\bor\\b\\s+", clean_name, flags=re.I) if clean(part)]\n'''
          if old not in source:
              raise SystemExit("Could not find name_variants raw_parts assignment")
          source = source.replace(old, new, 1)

          anchor = '''def paragraph_context(text, name):\n    paragraphs = [clean(part) for part in re.split(r"\\n\\s*\\n", text) if clean(part)]\n    variants = name_variants(name)\n    if not variants:\n        return ""\n    for variant in variants:\n        for paragraph in paragraphs:\n            if variant not in norm(paragraph):\n                continue\n            clauses = [clean(part) for part in re.split(r";|(?<=[.!?])\\s+", paragraph) if clean(part)]\n            for clause in clauses:\n                if variant in norm(clause):\n                    return clause\n            return paragraph\n    return ""\n\n\ndef md_enrichment(path, canonical_names=()):\n'''
          replacement = '''def paragraph_context(text, name):\n    paragraphs = [clean(part) for part in re.split(r"\\n\\s*\\n", text) if clean(part)]\n    variants = name_variants(name)\n    if not variants:\n        return ""\n    for variant in variants:\n        for paragraph in paragraphs:\n            if variant not in norm(paragraph):\n                continue\n            clauses = [clean(part) for part in re.split(r";|(?<=[.!?])\\s+", paragraph) if clean(part)]\n            for clause in clauses:\n                if variant in norm(clause):\n                    return clause\n            return paragraph\n    return ""\n\n\ndef compact_canonical_entries(text):\n    match = re.search(r"^##\\s+Canonical visitor records\\s*$([\\s\\S]*?)(?=^##\\s+|\\Z)", text, re.I | re.M)\n    if not match:\n        return []\n    section = clean(match.group(1))\n    return [clean(part).strip(" .") for part in section.split(";") if clean(part).strip(" .")]\n\n\ndef compact_list_context(name, entries):\n    canonical_tokens = {token for token in norm(name).split() if token not in GENERIC_NAME_TOKENS}\n    if len(canonical_tokens) < 2:\n        return ""\n    candidates = []\n    for entry in entries:\n        entry_tokens = {token for token in norm(entry).split() if token not in GENERIC_NAME_TOKENS}\n        if len(entry_tokens) < 2:\n            continue\n        if entry_tokens.issubset(canonical_tokens):\n            candidates.append((len(entry_tokens), len(norm(entry)), entry))\n    if not candidates:\n        return ""\n    candidates.sort(reverse=True)\n    best = candidates[0]\n    if len(candidates) > 1 and candidates[1][:2] == best[:2]:\n        return ""\n    return best[2]\n\n\ndef md_enrichment(path, canonical_names=()):\n'''
          if anchor not in source:
              raise SystemExit("Could not find paragraph_context/md_enrichment anchor")
          source = source.replace(anchor, replacement, 1)

          old = '''    distinctive_roots = [first_distinctive_token(name) for name in canonical_names]\n    root_counts = Counter(root for root in distinctive_roots if root)\n    for name in canonical_names:\n'''
          new = '''    compact_entries = compact_canonical_entries(text)\n    distinctive_roots = [first_distinctive_token(name) for name in canonical_names]\n    root_counts = Counter(root for root in distinctive_roots if root)\n    for name in canonical_names:\n'''
          if old not in source:
              raise SystemExit("Could not find md_enrichment canonical loop anchor")
          source = source.replace(old, new, 1)

          old = '''        if not context:\n            root = first_distinctive_token(name)\n            if root and root_counts[root] == 1:\n                context = paragraph_context(text, root)\n                match_method = "root-mention"\n        if not context:\n            continue\n'''
          new = '''        if not context:\n            root = first_distinctive_token(name)\n            if root and root_counts[root] == 1:\n                context = paragraph_context(text, root)\n                match_method = "root-mention"\n        if not context:\n            context = compact_list_context(name, compact_entries)\n            if context:\n                match_method = "compact-list"\n        if not context:\n            continue\n'''
          if old not in source:
              raise SystemExit("Could not find md_enrichment fallback block")
          source = source.replace(old, new, 1)

          if source == original:
              raise SystemExit("Compact-canonical patch was a no-op")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Regenerate and verify the final established aliases
        run: |
          python scripts/build_nepal_visitor_ready_master.py
          python - <<'PY'
          import json
          from pathlib import Path

          records = json.loads(Path("data/master/generated/nepal_master_visitor_ready.json").read_text())
          report = json.loads(Path("data/master/generated/validation_report.json").read_text())

          def find(province, district, name):
              for record in records:
                  if record.get("province") == province and record.get("district") == district and record.get("name") == name:
                      return record
              raise SystemExit(f"Missing known-case record: {province}/{district}/{name}")

          sculpture = find("Madhesh", "Bara", "Simraungadh archaeological sculpture-find landscape")
          bharat = find("Madhesh", "Sarlahi", "Bharat Tal (Bharat Lake)")

          assert report.get("district_count_ok") is True
          assert report.get("record_count_ok") is True
          assert report.get("explicit_hold_routed_ok") is True
          assert report.get("routable_without_match_ok") is True
          assert report.get("waterfall_geometry_ok") is True
          assert report.get("kavrepalanchok_visitor_ready_ok") is True
          assert sculpture.get("match_method")
          assert sculpture.get("access_status") != "ROUTING_HOLD"
          assert bharat.get("match_method")
          assert bharat.get("access_status") != "ROUTING_HOLD"
          PY

      - name: Commit builder and regenerated artifacts
        run: |
          git add -- \
            scripts/build_nepal_visitor_ready_master.py \
            data/master/generated/nepal_master_visitor_ready.json \
            data/master/generated/nepal_master_visitor_ready.csv \
            data/master/generated/validation_report.json
          git rm -- .github/workflows/finalize-compact-canonical-matching.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Match compact canonical visitor list aliases"
          git push origin HEAD:integration/nepal-visitor-ready-complete
