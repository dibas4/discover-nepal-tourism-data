name: Refine compact tourism aliases

on:
  push:
    branches:
      - integration/nepal-visitor-ready-complete
    paths:
      - ".github/workflows/refine-compact-aliases.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/nepal-visitor-ready-complete
          fetch-depth: 0

      - name: Apply conservative alias refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_nepal_visitor_ready_master.py")
          source = path.read_text(encoding="utf-8")
          original = source

          source = source.replace(
              '    "view", "viewpoint", "waterfall", "wetland", "wildlife",\n}',
              '    "view", "viewpoint", "waterfall", "wetland", "wildlife", "pass", "tea", "estate", "religious", "shrine", "memorial", "system", "sector", "buffer", "trekking",\n}'
          )
          source = source.replace(
              're.split(r"\\s*/\\s*|\\s+\\bor\\b\\s+", clean(name), flags=re.I)',
              're.split(r"\\s*/\\s*|\\s*,\\s*|\\s*\\+\\s*|\\s+\\band\\b\\s+|\\s+\\bor\\b\\s+", clean(name), flags=re.I)'
          )

          if source == original:
              raise SystemExit("Expected alias-matching source patterns were not found; refusing a no-op patch.")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Commit refinement and remove one-shot workflow
        run: |
          git add -- scripts/build_nepal_visitor_ready_master.py
          git rm -- .github/workflows/refine-compact-aliases.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine compact tourism alias separators"
          git push origin HEAD:integration/nepal-visitor-ready-complete
